name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Refactorizacion-ALFA
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Las pruebas corren en modo headless (configurado en pom.xml).
      - name: Compilar, probar y empaquetar
        run: mvn -B verify

      - name: Publicar reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: Refactorizacion-ALFA/target/surefire-reports/
