name: 🛠️ Solicitud de Modificación (MR)
description: Formulario técnico oficial para mantenimiento de ALFA-INVENTORY.
title: "[MR]: "
labels: ["mantenimiento", "alfa-inventory"]
body:
  - type: markdown
    attributes:
      value: |
        # SOLICITUD DE MODIFICACIÓN
        ---
        ## Sección I
        *Completar por el solicitante.*

  - type: input
    id: nombre_solicitante
    attributes:
      label: "Nombre del solicitante:"
    validations:
      required: true

  - type: input
    id: fecha_recepcion
    attributes:
      label: "Fecha de recepción:"
      placeholder: "DD/MM/AAAA"
    validations:
      required: true

  - type: input
    id: sistema
    attributes:
      label: "Sistema:"
      value: "ALFA-INVENTORY"
    validations:
      required: true

  - type: input
    id: creador
    attributes:
      label: "Creador:"
      description: "Persona que registra formalmente la solicitud."
    validations:
      required: true

  - type: textarea
    id: descripcion_problema
    attributes:
      label: "Descripción del problema"
    validations:
      required: true

  - type: dropdown
    id: prioridad_seccion_1
    attributes:
      label: "Prioridad"
      options: ["1", "2", "3", "4", "5"]
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---
        ## Sección II
        *Uso exclusivo del equipo técnico.*

  - type: input
    id: numero_mr
    attributes:
      label: "Número de MR:"
    validations:
      required: false

  - type: input
    id: mantenedor
    attributes:
      label: "Mantenedor:"
      placeholder: "Nombre del responsable asignado"
    validations:
      required: false

  - type: dropdown
    id: prioridad_final
    attributes:
      label: "Prioridad (Técnica):"
      options: ["1", "2", "3", "4", "5"]
    validations:
      required: false

  - type: dropdown
    id: tipo_mantenimiento
    attributes:
      label: "Tipo de mantenimiento:"
      options:
        - "Adaptativo"
        - "Correctivo"
        - "Perfectivo"
        - "Preventivo"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---
        ## Sección III
        *Control de estado y cierre.*

  - type: input
    id: id_opcion
    attributes:
      label: "Id opción:"
    validations:
      required: false

  - type: dropdown
    id: estado_mr
    attributes:
      label: "Estado del MR"
      options:
        - "Pendiente"
        - "En Análisis"
        - "Aprobado"
        - "Rechazado"
        - "Finalizado"
    validations:
      required: false

  - type: input
    id: fecha_seccion_3
    attributes:
      label: "Fecha:"
      placeholder: "DD/MM/AAAA"
    validations:
      required: false

  - type: textarea
    id: resultados_analisis
    attributes:
      label: "Resultados del análisis:"
    validations:
      required: false

  - type: input
    id: aprobado_por
    attributes:
      label: "Aprobado por:"
    validations:
      required: false
